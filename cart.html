<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - S.R.Tech</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/home/logo.png">
    <style>
        main {
            min-height: auto !important;
            height: auto !important;
        }

        main.cart-page {
            min-height: auto !important;
            height: auto !important;
        }

        .cart-page {
            max-width: 1320px;
            margin: 0 auto;
            padding: 36px 24px 60px;
        }

        .page-title {
            font-size: 2.3rem;
            font-weight: 700;
            color: #0f3a42;
            margin-bottom: 30px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.5fr 0.7fr;
            gap: 30px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .summary-panel {
            align-self: start;
        }

        .cart-card {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 18px;
            padding: 20px;
            border: 1px solid #d4d4d4;
            border-radius: 12px;
            background: #fff;
            align-items: center;
        }

        .cart-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-card-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-product-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: #0f3a42;
        }

        .cart-product-brand {
            font-size: 1rem;
            color: #54606f;
            margin: 0;
        }

        .cart-quantity {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #f4fafb;
            border: 1px solid #8ad2dc;
            border-radius: 12px;
            padding: 8px 12px;
            font-weight: 700;
            color: #0f3a42;
            width: fit-content;
        }

        .cart-quantity button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            background: #1ca98e;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            line-height: 1;
        }

        .cart-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f3a42;
            margin-top: 8px;
        }

        .summary-panel {
            background: #e9f7fa;
            padding: 28px;
            border-radius: 18px;
            border: 1px solid #c7e8eb;
        }

        .summary-title {
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 22px;
            color: #0f3a42;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 1.15rem;
            color: #212121;
        }

        .summary-row.total {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 8px;
            border-top: 1px solid rgba(15, 58, 66, 0.14);
            padding-top: 16px;
        }

        .summary-row.discount {
            color: #d32f2f;
        }

        .checkout-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 0;
            margin-top: 22px;
            background: #1ca98e;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .secure-note {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #1b4250;
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 500;
        }

        .secure-note span {
            font-size: 1.3rem;
        }

        @media (max-width: 980px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .cart-card {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .cart-card-body {
                align-items: center;
            }

            .cart-quantity {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>
    <script>
        fetch('navBar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            });
    </script>

    <main class="cart-page">
        <h1 class="page-title">My Cart</h1>
        <div class="cart-layout">
            <section class="cart-items">
                <article class="cart-card">
                    <img src="images/cart/cart 1.png" alt="Xiaomi Redmi 5 Active Speaker">
                    <div class="cart-card-body">
                        <div>
                            <h2 class="cart-product-title">Xiaomi Redmi 5 Active Speaker</h2>
                            <p class="cart-product-brand">Xiaomi</p>
                        </div>
                        <div class="cart-quantity" aria-label="Quantity selector">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                        <div class="cart-price">₹ 1200</div>
                    </div>
                </article>
                <article class="cart-card">
                    <img src="images/cart/cart 2.png" alt="Ajaaz Wireless Keyboard">
                    <div class="cart-card-body">
                        <div>
                            <h2 class="cart-product-title">Ajaaz Wireless Keyboard</h2>
                            <p class="cart-product-brand">Ajaaz</p>
                        </div>
                        <div class="cart-quantity" aria-label="Quantity selector">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                        <div class="cart-price">₹ 1650</div>
                    </div>
                </article>
                <article class="cart-card">
                    <img src="images/cart/cart 3.png" alt="Amazon Alexa Echo Speaker">
                    <div class="cart-card-body">
                        <div>
                            <h2 class="cart-product-title">Amazon Alexa Echo Speaker</h2>
                            <p class="cart-product-brand">Amazon</p>
                        </div>
                        <div class="cart-quantity" aria-label="Quantity selector">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                        <div class="cart-price">₹ 7500</div>
                    </div>
                </article>
                <article class="cart-card">
                    <img src="images/cart/cart 4.png" alt="JBL JR50 Wireless Robot">
                    <div class="cart-card-body">
                        <div>
                            <h2 class="cart-product-title">JBL JR50 Wireless Robot</h2>
                            <p class="cart-product-brand">JBL</p>
                        </div>
                        <div class="cart-quantity" aria-label="Quantity selector">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                        <div class="cart-price">₹ 2140</div>
                    </div>
                </article>
            </section>

            <aside class="summary-panel">
                <div class="summary-title">Order Summary</div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong>₹ 14,580</strong>
                </div>
                <div class="summary-row">
                    <span>Delivery Charges</span>
                    <strong>₹ 0</strong>
                </div>
                <div class="summary-row discount">
                    <span>Discount</span>
                    <strong>- ₹ 220</strong>
                </div>
                <div class="summary-row total">
                    <span>TOTAL</span>
                    <strong>₹ 14,360</strong>
                </div>
                <button class="checkout-btn">CHECKOUT</button>
                <div class="secure-note">
                    <span>🔒</span>
                    <span>100% Secure Payments</span>
                </div>
            </aside>
        </div>
    </main>

    <div id="footer-container"></div>
    <script>
        fetch('footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
</body>

</html>
